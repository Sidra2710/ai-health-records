{% extends "base.html" %}
{% block content %}

<div class="mb-4">
    <a href="{{ url_for('index') }}" class="text-decoration-none">
        &larr; Back to records
    </a>

    <h1 class="h3 mt-3">{{ mode }} patient</h1>

    <p class="text-secondary">
        Enter a valid date in dd/mm/yyyy format. All blood-test values
        must be numeric and zero or greater.
    </p>
</div>

<form method="post" class="card p-4">
    <div class="row g-3">

        <div class="col-md-6">
            <label class="form-label" for="full_name">Full name</label>
            <input class="form-control"
                   id="full_name"
                   name="full_name"
                   type="text"
                   autocomplete="name"
                   required
                   value="{{ patient.get('full_name', '') }}">
        </div>

        <div class="col-md-6">
            <label class="form-label" for="dob">
                Date of birth (dd/mm/yyyy)
            </label>
            <input class="form-control"
                   id="dob"
                   name="dob"
                   type="text"
                   placeholder="28/01/1960"
                   pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
                   title="Use dd/mm/yyyy, for example 28/01/1960"
                   required
                   value="{{ patient.get('dob', '') }}">
        </div>

        <div class="col-md-6">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control"
                   id="email"
                   name="email"
                   type="email"
                   autocomplete="email"
                   placeholder="name@example.com"
                   required
                   value="{{ patient.get('email', '') }}">
        </div>

        <div class="col-md-6">
            <label class="form-label" for="glucose">Glucose</label>
            <input class="form-control"
                   id="glucose"
                   name="glucose"
                   type="number"
                   min="0"
                   step="any"
                   required
                   value="{{ patient.get('glucose', '') }}">
        </div>

        <div class="col-md-6">
            <label class="form-label" for="haemoglobin">Haemoglobin</label>
            <input class="form-control"
                   id="haemoglobin"
                   name="haemoglobin"
                   type="number"
                   min="0"
                   step="any"
                   required
                   value="{{ patient.get('haemoglobin', '') }}">
        </div>

        <div class="col-md-6">
            <label class="form-label" for="cholesterol">Cholesterol</label>
            <input class="form-control"
                   id="cholesterol"
                   name="cholesterol"
                   type="number"
                   min="0"
                   step="any"
                   required
                   value="{{ patient.get('cholesterol', '') }}">
        </div>

        {% if mode == 'Edit' %}
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       name="refresh_ai"
                       value="yes"
                       id="refresh_ai">

                <label class="form-check-label" for="refresh_ai">
                    Generate fresh AI remarks after saving
                </label>
            </div>
            <small class="text-secondary">
                Leave unchecked to keep the existing remarks.
            </small>
        </div>
        {% endif %}

    </div>

    <div class="d-flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" type="submit">
            {{ mode }} record
        </button>

        <a class="btn btn-outline-secondary"
           href="{{ url_for('index') }}">Cancel</a>
    </div>
</form>

{% endblock %}
